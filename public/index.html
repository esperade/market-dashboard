<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Markets">
<meta name="theme-color" content="#0a0d11">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Markets Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0a0d11; color: #e2e8f0; font-family: 'SF Mono', 'Courier New', monospace; }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 12px) 12px env(safe-area-inset-bottom, 12px);
    padding-top: max(env(safe-area-inset-top), 12px);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0 14px;
    border-bottom: 1px solid #1e2d3d;
    margin-bottom: 14px;
    position: sticky;
    top: 0;
    background: #0a0d11;
    z-index: 10;
  }

  .logo { font-size: 13px; font-weight: 600; color: #f97316; letter-spacing: 2px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .clock { font-size: 11px; color: #64748b; font-variant-numeric: tabular-nums; }

  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #22c55e; display: inline-block;
    animation: pulse 2s infinite;
  }
  .live-dot.error { background: #ef4444; animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    background: #0f1923;
    border-radius: 6px;
    padding: 3px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 6px 4px;
    font-size: 10px;
    letter-spacing: 1px;
    color: #475569;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    border: none;
    background: none;
  }
  .tab.active { background: #1e3a5f; color: #38bdf8; }

  .section { display: none; }
  .section.active { display: block; }

  .section-label {
    font-size: 9px;
    color: #f97316;
    letter-spacing: 2px;
    font-weight: 600;
    margin: 14px 0 6px;
    border-left: 2px solid #f97316;
    padding-left: 8px;
  }

  .ticker-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    background: #0f1923;
    border: 0.5px solid #1e2d3d;
    border-radius: 4px;
    margin-bottom: 4px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .ticker-row:active { background: #151f2e; }

  .t-left { display: flex; flex-direction: column; gap: 3px; min-width: 90px; }
  .t-sym { font-size: 12px; font-weight: 600; color: #e2e8f0; letter-spacing: 1px; }
  .t-name { font-size: 10px; color: #475569; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }

  .t-spark { width: 64px; height: 28px; flex-shrink: 0; }

  .t-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .t-price { font-size: 13px; font-weight: 500; color: #e2e8f0; font-variant-numeric: tabular-nums; }
  .t-change { font-size: 10px; font-variant-numeric: tabular-nums; }

  .up { color: #22c55e; }
  .down { color: #ef4444; }
  .flat { color: #64748b; }

  .crypto-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .crypto-card {
    background: #0f1923;
    border: 0.5px solid #1e2d3d;
    border-radius: 6px;
    padding: 10px 12px;
  }
  .c-sym { font-size: 10px; color: #64748b; letter-spacing: 1px; margin-bottom: 4px; }
  .c-price { font-size: 15px; font-weight: 500; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .c-chg { font-size: 10px; font-variant-numeric: tabular-nums; }

  .fx-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    background: #0f1923;
    border: 0.5px solid #1e2d3d;
    border-radius: 4px;
    margin-bottom: 4px;
  }
  .fx-pair { font-size: 11px; color: #94a3b8; letter-spacing: 1px; }
  .fx-right { display: flex; align-items: center; gap: 10px; }
  .fx-rate { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .fx-chg { font-size: 10px; font-variant-numeric: tabular-nums; }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: #475569;
    margin-top: 16px;
    padding-top: 10px;
    border-top: 1px solid #1e2d3d;
  }
  .refresh-btn {
    margin-left: auto;
    background: #1e2d3d;
    border: 0.5px solid #334155;
    color: #94a3b8;
    font-size: 10px;
    padding: 5px 12px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 1px;
    font-family: inherit;
    transition: all 0.15s;
  }
  .refresh-btn:active { background: #264059; color: #e2e8f0; }

  .loading-row {
    background: #0f1923;
    border: 0.5px solid #1e2d3d;
    border-radius: 4px;
    padding: 12px;
    margin-bottom: 4px;
    color: #475569;
    font-size: 11px;
    text-align: center;
  }

  .error-msg {
    background: #1a0f0f;
    border: 0.5px solid #3d1e1e;
    border-radius: 4px;
    padding: 12px;
    color: #ef4444;
    font-size: 11px;
    text-align: center;
    margin-bottom: 4px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">■ MARKETS</div>
    <div class="header-right">
      <span class="live-dot" id="dot"></span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('stocks')">주식</button>
    <button class="tab" onclick="switchTab('crypto')">코인</button>
    <button class="tab" onclick="switchTab('fx')">환율</button>
  </div>

  <!-- 주식 탭 -->
  <div class="section active" id="tab-stocks">
    <div class="section-label">▸ 한국 주식</div>
    <div id="kr-list"><div class="loading-row">데이터 로딩 중...</div></div>

    <div class="section-label">▸ 미국 주식</div>
    <div id="us-list"><div class="loading-row">데이터 로딩 중...</div></div>
  </div>

  <!-- 코인 탭 -->
  <div class="section" id="tab-crypto">
    <div class="section-label">▸ 암호화폐</div>
    <div class="crypto-grid" id="crypto-list">
      <div class="loading-row" style="grid-column:span 2">데이터 로딩 중...</div>
    </div>
  </div>

  <!-- 환율 탭 -->
  <div class="section" id="tab-fx">
    <div class="section-label">▸ 환율</div>
    <div id="fx-list"><div class="loading-row">데이터 로딩 중...</div></div>
  </div>

  <div class="status-bar">
    <span class="live-dot" id="dot2"></span>
    <span id="update-time">업데이트 중...</span>
    <button class="refresh-btn" onclick="fetchAll()">↻ 새로고침</button>
  </div>
</div>

<script>
/* ── 설정 ── */
const KR_SYMBOLS   = ['005930.KS','000660.KS','^KS11','^KQ11'];
const KR_NAMES     = {'005930.KS':'삼성전자','000660.KS':'SK하이닉스','^KS11':'KOSPI','^KQ11':'KOSDAQ'};
const US_SYMBOLS   = ['^GSPC','^IXIC','NVDA','AAPL','MSFT'];
const US_NAMES     = {'^GSPC':'S&P 500','^IXIC':'나스닥',NVDA:'NVIDIA',AAPL:'Apple',MSFT:'Microsoft'};
const CRYPTO_SYMS  = ['BTC-USD','ETH-USD','SOL-USD','XRP-USD'];
const CRYPTO_NAMES = {'BTC-USD':'Bitcoin','ETH-USD':'Ethereum','SOL-USD':'Solana','XRP-USD':'Ripple'};
const FX_SYMBOLS   = ['USDKRW=X','EURKRW=X','JPYKRW=X','USDJPY=X','GBPUSD=X'];
const FX_NAMES     = {'USDKRW=X':'USD/KRW','EURKRW=X':'EUR/KRW','JPYKRW=X':'JPY/KRW','USDJPY=X':'USD/JPY','GBPUSD=X':'GBP/USD'};

/* ── 유틸 ── */
const sign = n => n >= 0 ? '+' : '';
const cls  = n => n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
function fmt(n, dec) {
  if (n === null || n === undefined || isNaN(n)) return '--';
  return n.toLocaleString('ko-KR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function makeSvgSpark(closes, isUp) {
  if (!closes || closes.length < 2) return '';
  const W = 64, H = 28, pad = 2;
  const min = Math.min(...closes), max = Math.max(...closes), range = max - min || 1;
  const pts = closes.map((v, i) =>
    `${pad + (i / (closes.length - 1)) * (W - pad * 2)},${H - pad - ((v - min) / range) * (H - pad * 2)}`
  ).join(' ');
  const color = isUp ? '#22c55e' : '#ef4444';
  return `<svg class="t-spark" viewBox="0 0 ${W} ${H}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

/* ── API fetch (Vercel proxy 경유) ── */
async function fetchQuotes(symbols) {
  const sym = symbols.join(',');
  // Vercel 배포 시: /api/stock?symbols=...
  // 로컬 테스트 시 Yahoo Finance 직접 호출 시도
  try {
    const r = await fetch(`/api/stock?symbols=${encodeURIComponent(sym)}`);
    if (!r.ok) throw new Error('proxy error');
    return await r.json();
  } catch {
    // 프록시 없을 때 직접 호출 (CORS 허용 환경에서만 동작)
    const r2 = await fetch(
      `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${sym}&fields=regularMarketPrice,regularMarketChange,regularMarketChangePercent,shortName`,
      { headers: { 'User-Agent': 'Mozilla/5.0' } }
    );
    const d = await r2.json();
    return { quotes: d.quoteResponse?.result || [], spark: [] };
  }
}

/* ── CoinGecko (CORS 허용, 키 불필요) ── */
async function fetchCrypto() {
  const ids = 'bitcoin,ethereum,solana,ripple';
  const r = await fetch(
    `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`
  );
  return r.json();
}

/* ── 렌더 함수 ── */
function renderStocks(quotes, names, containerId, currency = '') {
  const el = document.getElementById(containerId);
  if (!quotes.length) { el.innerHTML = '<div class="error-msg">데이터를 가져올 수 없습니다</div>'; return; }

  el.innerHTML = quotes.map(q => {
    const price = q.regularMarketPrice;
    const chg   = q.regularMarketChange;
    const pct   = q.regularMarketChangePercent;
    const name  = names[q.symbol] || q.shortName || q.symbol;
    const isUp  = chg >= 0;
    const dec   = price > 10000 ? 0 : price > 100 ? 2 : 2;

    return `<div class="ticker-row">
      <div class="t-left">
        <span class="t-sym">${q.symbol.replace('.KS','').replace('.KQ','')}</span>
        <span class="t-name">${name}</span>
      </div>
      ${makeSvgSpark([], isUp)}
      <div class="t-right">
        <span class="t-price">${currency}${fmt(price, dec)}</span>
        <span class="t-change ${cls(chg)}">${sign(chg)}${fmt(pct, 2)}%</span>
      </div>
    </div>`;
  }).join('');
}

function renderCrypto(data) {
  const map = {
    bitcoin: { sym: 'BTC', name: 'Bitcoin' },
    ethereum: { sym: 'ETH', name: 'Ethereum' },
    solana: { sym: 'SOL', name: 'Solana' },
    ripple: { sym: 'XRP', name: 'Ripple' },
  };
  const el = document.getElementById('crypto-list');
  el.innerHTML = Object.entries(map).map(([id, info]) => {
    const d = data[id];
    if (!d) return '';
    const price = d.usd, chg = d.usd_24h_change;
    const dec = price > 1000 ? 0 : price > 1 ? 2 : 4;
    return `<div class="crypto-card">
      <div class="c-sym">${info.sym}/USD</div>
      <div class="c-price ${cls(chg)}">$${fmt(price, dec)}</div>
      <div class="c-chg ${cls(chg)}">${sign(chg)}${fmt(chg, 2)}%</div>
    </div>`;
  }).join('');
}

function renderFX(quotes) {
  const el = document.getElementById('fx-list');
  if (!quotes.length) { el.innerHTML = '<div class="error-msg">데이터를 가져올 수 없습니다</div>'; return; }
  el.innerHTML = quotes.map(q => {
    const rate = q.regularMarketPrice, chg = q.regularMarketChangePercent;
    const name = FX_NAMES[q.symbol] || q.symbol;
    const dec  = rate > 100 ? 2 : rate > 10 ? 3 : 4;
    return `<div class="fx-row">
      <span class="fx-pair">${name}</span>
      <div class="fx-right">
        <span class="fx-rate ${cls(chg)}">${fmt(rate, dec)}</span>
        <span class="fx-chg ${cls(chg)}">${sign(chg)}${fmt(chg, 2)}%</span>
      </div>
    </div>`;
  }).join('');
}

/* ── 탭 전환 ── */
function switchTab(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
}

/* ── 메인 fetch ── */
let isLoading = false;
async function fetchAll() {
  if (isLoading) return;
  isLoading = true;
  document.getElementById('update-time').textContent = '업데이트 중...';

  try {
    const [krData, usData, cryptoData, fxData] = await Promise.allSettled([
      fetchQuotes(KR_SYMBOLS),
      fetchQuotes(US_SYMBOLS),
      fetchCrypto(),
      fetchQuotes(FX_SYMBOLS),
    ]);

    if (krData.status === 'fulfilled') renderStocks(krData.value.quotes, KR_NAMES, 'kr-list', '₩');
    if (usData.status === 'fulfilled') renderStocks(usData.value.quotes, US_NAMES, 'us-list', '$');
    if (cryptoData.status === 'fulfilled') renderCrypto(cryptoData.value);
    if (fxData.status === 'fulfilled') renderFX(fxData.value.quotes);

    document.querySelectorAll('.live-dot').forEach(d => { d.classList.remove('error'); });
    const now = new Date();
    document.getElementById('update-time').textContent =
      `${now.toLocaleTimeString('ko-KR')} 업데이트`;
  } catch (e) {
    document.querySelectorAll('.live-dot').forEach(d => d.classList.add('error'));
    document.getElementById('update-time').textContent = '업데이트 실패';
  }

  isLoading = false;
}

/* ── 시계 & 자동 갱신 ── */
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('ko-KR');
}, 1000);

fetchAll();
setInterval(fetchAll, 30000); // 30초마다 갱신

/* ── PWA 서비스 워커 ── */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
